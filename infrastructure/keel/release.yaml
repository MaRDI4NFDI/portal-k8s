apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keel
spec:
  interval: 30m
  chart:
    spec:
      chart: keel
      version: "1.2.3"
      sourceRef:
        kind: HelmRepository
        name: keel
        namespace: flux-system
  values:
    # Flux owns the Helm releases.
    helmProvider:
      enabled: false
    rbac:
      clusterRole:
        # The default rules minus read access to all secrets in the cluster:
        # every tracked image is public.
        rules:
          - apiGroups: [""]
            resources: [namespaces, nodes]
            verbs: [get, watch, list]
          - apiGroups: ["", extensions, apps, batch]
            resources: [pods, replicasets, replicationcontrollers, statefulsets, deployments, daemonsets, jobs, cronjobs]
            verbs: [get, delete, watch, list, update]
          - apiGroups: [""]
            resources: [configmaps, pods/portforward]
            verbs: [get, create, update]
