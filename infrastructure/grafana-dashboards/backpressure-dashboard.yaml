apiVersion: v1
kind: ConfigMap
metadata:
  name: backpressure-dashboard
  namespace: kube-prometheus
  labels:
    grafana_dashboard: "1"
data:
  backpressure-dashboard.json: |
    {
      "title": "MaRDI Backpressure",
      "uid": "mardi-backpressure",
      "tags": ["backpressure", "mediawiki", "varnish", "traefik", "mardi"],
      "timezone": "browser",
      "refresh": "30s",
      "time": { "from": "now-3h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Backpressure path",
          "description": "Admission pressure propagates outwards. Every occupied PHP-FPM worker counts, independently of what the request is executing or waiting for.",
          "type": "text",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 3 },
          "options": {
            "mode": "markdown",
            "content": "### PHP-FPM full → Apache worker limit → Varnish backend limit → Traefik in-flight limit → reject\nApache worker utilization is the PHP-FPM capacity proxy because both limits are identical per pod. Varnish admits at most the aggregate PHP-FPM capacity, reserving one connection per Apache pod for authenticated users, and exposes its pressure and shedding directly."
          }
        },
        {
          "id": 22,
          "title": "Apache saturation",
          "description": "Aggregate busy Apache workers divided by all configured worker slots. This is the PHP-FPM capacity proxy; red means new work cannot reach PHP-FPM promptly.",
          "type": "stat",
          "gridPos": { "x": 0, "y": 3, "w": 8, "h": 5 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.8 },
                  { "color": "red", "value": 0.95 }
                ]
              }
            }
          },
          "targets": [{
            "refId": "A",
            "expr": "sum(apache_workers{namespace=\"production\",state=\"busy\"}) / sum(apache_scoreboard{namespace=\"production\"})",
            "legendFormat": "Apache"
          }],
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 23,
          "title": "Varnish saturation",
          "description": "Highest utilization of the anonymous or authenticated backend connection pool.",
          "type": "stat",
          "gridPos": { "x": 8, "y": 3, "w": 8, "h": 5 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.8 },
                  { "color": "red", "value": 0.95 }
                ]
              }
            }
          },
          "targets": [{
            "refId": "A",
            "expr": "max(sum by (backend) (varnish_backend_conn{namespace=\"production\",backend=~\"anon|default\"}) / on (backend) mardi_varnish_backend_max_connections{namespace=\"production\"})",
            "legendFormat": "Varnish"
          }],
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 24,
          "title": "Traefik saturation",
          "description": "Current portal request rate divided by an assumed Traefik capacity of 5,000 requests/s.",
          "type": "stat",
          "gridPos": { "x": 16, "y": 3, "w": 8, "h": 5 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.8 },
                  { "color": "red", "value": 0.95 }
                ]
              }
            }
          },
          "targets": [{
            "refId": "A",
            "expr": "sum(rate(traefik_router_requests_total{job=\"traefik\",router=~\"production-wikibase-.*@kubernetescrd\"}[$__rate_interval])) / 5000",
            "legendFormat": "Traefik"
          }],
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 25,
          "title": "Reaches Wikibase",
          "description": "Varnish backend requests as a percentage of current incoming portal requests. Retries and background refreshes can make this an approximation rather than an exact partition.",
          "type": "stat",
          "gridPos": { "x": 0, "y": 8, "w": 6, "h": 5 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1 } },
          "targets": [{
            "refId": "A",
            "expr": "clamp_max(sum(rate(varnish_main_backend_req{namespace=\"production\"}[$__rate_interval])) / sum(rate(traefik_router_requests_total{job=\"traefik\",router=~\"production-wikibase-.*@kubernetescrd\"}[$__rate_interval])), 1)",
            "legendFormat": "Wikibase"
          }],
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 26,
          "title": "Handled by Varnish",
          "description": "Varnish cache hits as a percentage of current incoming portal requests.",
          "type": "stat",
          "gridPos": { "x": 6, "y": 8, "w": 6, "h": 5 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1 } },
          "targets": [{
            "refId": "A",
            "expr": "clamp_max(sum(rate(varnish_main_cache_hit{namespace=\"production\"}[$__rate_interval])) / sum(rate(traefik_router_requests_total{job=\"traefik\",router=~\"production-wikibase-.*@kubernetescrd\"}[$__rate_interval])), 1)",
            "legendFormat": "cache hits"
          }],
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 27,
          "title": "Dismissed by Varnish",
          "description": "Backend-busy rejections as a percentage of current incoming portal requests.",
          "type": "stat",
          "gridPos": { "x": 12, "y": 8, "w": 6, "h": 5 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1 } },
          "targets": [{
            "refId": "A",
            "expr": "clamp_max(sum(rate(varnish_main_backend_busy{namespace=\"production\"}[$__rate_interval])) / sum(rate(traefik_router_requests_total{job=\"traefik\",router=~\"production-wikibase-.*@kubernetescrd\"}[$__rate_interval])), 1)",
            "legendFormat": "backend busy"
          }],
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 28,
          "title": "Dismissed by Traefik",
          "description": "Portal requests counted at the router but not forwarded to the Varnish service, as a percentage of current incoming requests.",
          "type": "stat",
          "gridPos": { "x": 18, "y": 8, "w": 6, "h": 5 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1 } },
          "targets": [{
            "refId": "A",
            "expr": "clamp_max(clamp_min(sum(rate(traefik_router_requests_total{job=\"traefik\",router=~\"production-wikibase-.*@kubernetescrd\"}[$__rate_interval])) - sum(rate(traefik_service_requests_total{job=\"traefik\",exported_service=~\"production-wikibase-.*@kubernetescrd\"}[$__rate_interval])), 0) / sum(rate(traefik_router_requests_total{job=\"traefik\",router=~\"production-wikibase-.*@kubernetescrd\"}[$__rate_interval])), 1)",
            "legendFormat": "not forwarded"
          }],
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 2,
          "title": "Portal request rate",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 13, "w": 8, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "reqps", "min": 0 } },
          "targets": [{
            "refId": "A",
            "expr": "sum(rate(traefik_router_requests_total{job=\"traefik\",router=~\"production-wikibase-.*@kubernetescrd\"}[$__rate_interval]))",
            "legendFormat": "requests/s"
          }]
        },
        {
          "id": 3,
          "title": "Portal responses by status",
          "description": "429 shows explicit rejection; 502–504 show failed or timed-out requests while pressure propagates through the current stack.",
          "type": "timeseries",
          "gridPos": { "x": 8, "y": 13, "w": 8, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "reqps", "min": 0 } },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (code) (rate(traefik_router_requests_total{job=\"traefik\",router=~\"production-wikibase-.*@kubernetescrd\",code=~\"2..|3..\"}[$__rate_interval]))",
              "legendFormat": "{{code}}"
            },
            {
              "refId": "B",
              "expr": "sum by (code) (rate(traefik_router_requests_total{job=\"traefik\",router=~\"production-wikibase-.*@kubernetescrd\",code=~\"429|5..\"}[$__rate_interval]))",
              "legendFormat": "{{code}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Portal request latency",
          "type": "timeseries",
          "gridPos": { "x": 16, "y": 13, "w": 8, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "s", "min": 0 } },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.50, sum(rate(traefik_router_request_duration_seconds_bucket{job=\"traefik\",router=~\"production-wikibase-.*@kubernetescrd\"}[$__rate_interval])) by (le))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum(rate(traefik_router_request_duration_seconds_bucket{job=\"traefik\",router=~\"production-wikibase-.*@kubernetescrd\"}[$__rate_interval])) by (le))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum(rate(traefik_router_request_duration_seconds_bucket{job=\"traefik\",router=~\"production-wikibase-.*@kubernetescrd\"}[$__rate_interval])) by (le))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 5,
          "title": "Traefik open connections",
          "description": "Entrypoint-wide connection count. This includes services other than the portal and becomes the outer backpressure signal once a global in-flight limit is configured.",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 20, "w": 8, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "none", "min": 0 } },
          "targets": [{
            "refId": "A",
            "expr": "sum(traefik_open_connections{job=\"traefik\",entrypoint=\"websecure\"})",
            "legendFormat": "websecure"
          }]
        },
        {
          "id": 6,
          "title": "Explicit rejection rate",
          "description": "This should become the preferred overload outcome after admission control is enabled. Until then it may stay at zero while 5xx responses rise.",
          "type": "timeseries",
          "gridPos": { "x": 8, "y": 20, "w": 8, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "reqps", "min": 0 } },
          "targets": [{
            "refId": "A",
            "expr": "sum(rate(traefik_router_requests_total{job=\"traefik\",router=~\"production-wikibase-.*@kubernetescrd\",code=\"429\"}[$__rate_interval])) or vector(0)",
            "legendFormat": "429/s"
          }]
        },
        {
          "id": 7,
          "title": "Gateway failure rate",
          "type": "timeseries",
          "gridPos": { "x": 16, "y": 20, "w": 8, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "reqps", "min": 0 } },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (code) (rate(traefik_router_requests_total{job=\"traefik\",router=~\"production-wikibase-.*@kubernetescrd\",code=~\"502|503|504\"}[$__rate_interval]))",
              "legendFormat": "{{code}}"
            }
          ]
        },
        {
          "id": 8,
          "title": "PHP-FPM layer",
          "type": "row",
          "gridPos": { "x": 0, "y": 40, "w": 24, "h": 1 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 9,
          "title": "MediaWiki CPU",
          "description": "CPU use is useful context but does not determine whether the PHP-FPM pool is full; workers waiting on dependencies can consume a slot without consuming CPU.",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 41, "w": 8, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "cores", "min": 0 } },
          "targets": [{
            "refId": "A",
            "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"production\",pod=~\"wikibase-[^-]+-[^-]+\",container=\"mediawiki\"}[$__rate_interval]))",
            "legendFormat": "aggregate"
          }]
        },
        {
          "id": 10,
          "title": "MediaWiki memory limit usage",
          "type": "timeseries",
          "gridPos": { "x": 8, "y": 41, "w": 8, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1 } },
          "targets": [{
            "refId": "A",
            "expr": "sum(container_memory_working_set_bytes{namespace=\"production\",pod=~\"wikibase-[^-]+-[^-]+\",container=\"mediawiki\"}) / sum(kube_pod_container_resource_limits{namespace=\"production\",pod=~\"wikibase-[^-]+-[^-]+\",container=\"mediawiki\",resource=\"memory\",unit=\"byte\"})",
            "legendFormat": "aggregate"
          }]
        },
        {
          "id": 11,
          "title": "Wikibase container restarts",
          "description": "Unexpected restarts by container. PHP-FPM and Apache should remain at zero when the admission limit is reached.",
          "type": "timeseries",
          "gridPos": { "x": 16, "y": 41, "w": 8, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "none", "min": 0 } },
          "targets": [{
            "refId": "A",
            "expr": "sum by (container) (kube_pod_container_status_restarts_total{namespace=\"production\",pod=~\"wikibase-[^-]+-[^-]+\"})",
            "legendFormat": "{{container}}"
          }]
        },
        {
          "id": 12,
          "title": "PHP-FPM capacity proxy",
          "description": "Aggregate busy Apache workers divided by all configured slots. Apache MaxRequestWorkers and PHP-FPM pm.max_children are identical, so 100% means no new request can be handed to PHP-FPM. This counts workers equally whether executing PHP or waiting on a dependency.",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 48, "w": 8, "h": 7 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.8 },
                  { "color": "red", "value": 0.95 }
                ]
              }
            }
          },
          "targets": [{
            "refId": "A",
            "expr": "sum(apache_workers{namespace=\"production\",state=\"busy\"}) / sum(apache_scoreboard{namespace=\"production\"})",
            "legendFormat": "aggregate"
          }]
        },
        {
          "id": 20,
          "title": "Apache workers",
          "type": "timeseries",
          "gridPos": { "x": 8, "y": 48, "w": 8, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "none", "min": 0 } },
          "targets": [{
            "refId": "A",
            "expr": "sum by (state) (apache_workers{namespace=\"production\"})",
            "legendFormat": "{{state}}"
          }]
        },
        {
          "id": 21,
          "title": "All Apache metrics targets available",
          "description": "1 only when every Apache exporter target is being scraped successfully.",
          "type": "stat",
          "gridPos": { "x": 16, "y": 48, "w": 8, "h": 7 },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [{
                "type": "value",
                "options": {
                  "0": { "text": "Down", "color": "red" },
                  "1": { "text": "Up", "color": "green" }
                }
              }]
            }
          },
          "targets": [{
            "refId": "A",
            "expr": "min(up{job=\"production/wikibase-apache\"})",
            "legendFormat": "all targets"
          }],
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 13,
          "title": "Varnish layer",
          "type": "row",
          "gridPos": { "x": 0, "y": 27, "w": 24, "h": 1 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 14,
          "title": "Varnish memory limit usage",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 28, "w": 8, "h": 7 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.8 },
                  { "color": "red", "value": 0.9 }
                ]
              }
            }
          },
          "targets": [{
            "refId": "A",
            "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"production\",pod=~\"varnish-.*\",container=\"varnish-cache\"}) / sum by (pod) (kube_pod_container_resource_limits{namespace=\"production\",pod=~\"varnish-.*\",container=\"varnish-cache\",resource=\"memory\",unit=\"byte\"})",
            "legendFormat": "{{pod}}"
          }]
        },
        {
          "id": 15,
          "title": "Varnish CPU",
          "type": "timeseries",
          "gridPos": { "x": 8, "y": 28, "w": 8, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "cores", "min": 0 } },
          "targets": [{
            "refId": "A",
            "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"production\",pod=~\"varnish-.*\",container=\"varnish-cache\"}[$__rate_interval]))",
            "legendFormat": "{{pod}}"
          }]
        },
        {
          "id": 16,
          "title": "Varnish backend saturation",
          "description": "Current connections divided by each pool's limit. Anonymous capacity stops one worker short per Apache pod, minus the anonymous search pool; the reserved connections form the authenticated pool. A full search pool only rejects searches, so the Varnish overview ignores it.",
          "type": "timeseries",
          "gridPos": { "x": 16, "y": 28, "w": 8, "h": 7 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.8 },
                  { "color": "red", "value": 0.95 }
                ]
              }
            }
          },
          "targets": [{
            "refId": "A",
            "expr": "sum by (backend) (varnish_backend_conn{namespace=\"production\",backend=~\"anon|default|search\"}) / on (backend) mardi_varnish_backend_max_connections{namespace=\"production\"}",
            "legendFormat": "{{backend}}"
          }]
        },
        {
          "id": 17,
          "title": "Varnish restarts",
          "type": "stat",
          "gridPos": { "x": 0, "y": 35, "w": 8, "h": 5 },
          "fieldConfig": { "defaults": { "unit": "none" } },
          "targets": [{
            "refId": "A",
            "expr": "sum(kube_pod_container_status_restarts_total{namespace=\"production\",pod=~\"varnish-.*\",container=\"varnish-cache\"})",
            "legendFormat": "restarts"
          }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 18,
          "title": "Last Varnish termination was OOM",
          "description": "1 means the current pod's most recent terminated Varnish process was OOM-killed; 0 means it was not or the pod has not restarted.",
          "type": "stat",
          "gridPos": { "x": 8, "y": 35, "w": 8, "h": 5 },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [{
                "type": "value",
                "options": {
                  "0": { "text": "No", "color": "green" },
                  "1": { "text": "Yes", "color": "red" }
                }
              }],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          },
          "targets": [{
            "refId": "A",
            "expr": "max(kube_pod_container_status_last_terminated_reason{namespace=\"production\",pod=~\"varnish-.*\",container=\"varnish-cache\",reason=\"OOMKilled\"}) or vector(0)",
            "legendFormat": "OOMKilled"
          }],
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 19,
          "title": "Varnish shedding and queueing",
          "description": "Rates of deliberate backend rejection and pressure inside Varnish. Backend busy is the expected signal when the split connection caps protect Apache/PHP-FPM.",
          "type": "timeseries",
          "gridPos": { "x": 16, "y": 35, "w": 8, "h": 5 },
          "fieldConfig": { "defaults": { "unit": "ops", "min": 0 } },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(varnish_main_backend_busy{namespace=\"production\"}[$__rate_interval]))",
              "legendFormat": "backend busy/s"
            },
            {
              "refId": "B",
              "expr": "sum(rate(varnish_main_sess_queued{namespace=\"production\"}[$__rate_interval]))",
              "legendFormat": "sessions queued/s"
            },
            {
              "refId": "C",
              "expr": "sum(rate(varnish_main_sess_dropped{namespace=\"production\"}[$__rate_interval]))",
              "legendFormat": "sessions dropped/s"
            },
            {
              "refId": "D",
              "expr": "sum(rate(varnish_main_threads_limited{namespace=\"production\"}[$__rate_interval]))",
              "legendFormat": "threads limited/s"
            }
          ]
        }
      ],
      "schemaVersion": 39,
      "version": 2
    }
