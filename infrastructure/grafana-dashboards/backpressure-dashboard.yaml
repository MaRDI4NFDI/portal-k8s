apiVersion: v1
kind: ConfigMap
metadata:
  name: backpressure-dashboard
  namespace: kube-prometheus
  labels:
    grafana_dashboard: "1"
data:
  backpressure-dashboard.json: |
    {
      "title": "MaRDI Backpressure",
      "uid": "mardi-backpressure",
      "tags": ["backpressure", "mediawiki", "varnish", "traefik", "mardi"],
      "timezone": "browser",
      "refresh": "30s",
      "time": { "from": "now-3h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Backpressure path",
          "description": "Admission pressure propagates outwards. Every occupied PHP-FPM worker counts, independently of what the request is executing or waiting for.",
          "type": "text",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 3 },
          "options": {
            "mode": "markdown",
            "content": "### PHP-FPM full → Apache worker limit → Varnish backend limit → Traefik in-flight limit → reject\nApache has one worker beyond PHP-FPM capacity per pod so status and health checks remain reachable during saturation. Varnish admission stays capped at aggregate PHP-FPM capacity, reserving one backend connection per Apache pod for authenticated users, and exposes its pressure and shedding directly."
          }
        },
        {
          "id": 22,
          "title": "Apache saturation",
          "description": "Aggregate busy Apache workers divided by all configured worker slots. One additional worker per pod is reserved beyond PHP-FPM capacity for monitoring and health checks, so a full PHP-FPM pool appears just below 100%.",
          "type": "stat",
          "gridPos": { "x": 16, "y": 3, "w": 8, "h": 4 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.8 },
                  { "color": "red", "value": 0.95 }
                ]
              }
            }
          },
          "targets": [{
            "refId": "A",
            "expr": "sum(apache_workers{namespace=\"production\",state=\"busy\"}) / sum(apache_scoreboard{namespace=\"production\"})",
            "legendFormat": "Apache"
          }],
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 23,
          "title": "Varnish saturation",
          "description": "Highest utilization of the anonymous or authenticated backend connection pool.",
          "type": "stat",
          "gridPos": { "x": 16, "y": 7, "w": 8, "h": 4 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.8 },
                  { "color": "red", "value": 0.95 }
                ]
              }
            }
          },
          "targets": [{
            "refId": "A",
            "expr": "max(sum by (backend) (varnish_backend_conn{namespace=\"production\",backend=~\"anon|default\"}) / on (backend) mardi_varnish_backend_max_connections{namespace=\"production\"})",
            "legendFormat": "Varnish"
          }],
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 24,
          "title": "Traefik saturation",
          "description": "Current portal request rate divided by an assumed Traefik capacity of 5,000 requests/s.",
          "type": "stat",
          "gridPos": { "x": 16, "y": 11, "w": 8, "h": 4 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.8 },
                  { "color": "red", "value": 0.95 }
                ]
              }
            }
          },
          "targets": [{
            "refId": "A",
            "expr": "sum(rate(traefik_router_requests_total{job=\"traefik\",router=~\"production-wikibase-.*@kubernetescrd\"}[$__rate_interval])) / 5000",
            "legendFormat": "Traefik"
          }],
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 25,
          "title": "Current portal request handling",
          "description": "Current request rates by handling outcome. Varnish backend requests, retries, and background refreshes make this an operational approximation rather than an exact partition of incoming requests.",
          "type": "piechart",
          "gridPos": { "x": 0, "y": 3, "w": 16, "h": 12 },
          "fieldConfig": { "defaults": { "unit": "reqps", "min": 0 } },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(varnish_main_backend_req{namespace=\"production\"}[$__rate_interval]))",
              "legendFormat": "Reaches Wikibase",
              "instant": true
            },
            {
              "refId": "B",
              "expr": "sum(rate(varnish_main_cache_hit{namespace=\"production\"}[$__rate_interval]))",
              "legendFormat": "Handled by Varnish",
              "instant": true
            },
            {
              "refId": "C",
              "expr": "sum(rate(varnish_main_backend_busy{namespace=\"production\"}[$__rate_interval]))",
              "legendFormat": "Dismissed by Varnish",
              "instant": true
            },
            {
              "refId": "D",
              "expr": "clamp_min(sum(rate(traefik_router_requests_total{job=\"traefik\",router=~\"production-wikibase-.*@kubernetescrd\"}[$__rate_interval])) - sum(rate(traefik_service_requests_total{job=\"traefik\",exported_service=~\"production-wikibase-.*@kubernetescrd\"}[$__rate_interval])), 0)",
              "legendFormat": "Dismissed by Traefik",
              "instant": true
            }
          ],
          "options": {
            "pieType": "pie",
            "displayLabels": ["name", "value"],
            "reduceOptions": { "values": false, "calcs": ["lastNotNull"], "fields": "" },
            "legend": { "displayMode": "table", "placement": "right", "showLegend": true, "values": ["value", "percent"] },
            "tooltip": { "mode": "single", "sort": "none" }
          }
        },
        {
          "id": 2,
          "title": "Portal request rate",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 15, "w": 8, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "reqps", "min": 0 } },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(traefik_router_requests_total{job=\"traefik\",router=~\"production-wikibase-.*@kubernetescrd\"}[$__rate_interval]))",
              "legendFormat": "Incoming"
            },
            {
              "refId": "B",
              "expr": "sum(rate(varnish_main_cache_hit{namespace=\"production\"}[$__rate_interval]))",
              "legendFormat": "Handled by Varnish"
            },
            {
              "refId": "C",
              "expr": "sum(rate(varnish_main_backend_req{namespace=\"production\"}[$__rate_interval]))",
              "legendFormat": "Reaches Wikibase"
            }
          ]
        },
        {
          "id": 3,
          "title": "Portal responses by status",
          "description": "429 shows explicit rejection; 502–504 show failed or timed-out requests while pressure propagates through the current stack.",
          "type": "timeseries",
          "gridPos": { "x": 8, "y": 15, "w": 8, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "reqps", "min": 0 } },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (code) (rate(traefik_router_requests_total{job=\"traefik\",router=~\"production-wikibase-.*@kubernetescrd\",code=~\"2..|3..\"}[$__rate_interval]))",
              "legendFormat": "{{code}}"
            },
            {
              "refId": "B",
              "expr": "sum by (code) (rate(traefik_router_requests_total{job=\"traefik\",router=~\"production-wikibase-.*@kubernetescrd\",code=~\"429|5..\"}[$__rate_interval]))",
              "legendFormat": "{{code}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Portal request latency",
          "type": "timeseries",
          "gridPos": { "x": 16, "y": 15, "w": 8, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "s", "min": 0, "max": 10 } },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.50, sum(rate(traefik_router_request_duration_seconds_bucket{job=\"traefik\",router=~\"production-wikibase-.*@kubernetescrd\"}[$__rate_interval])) by (le))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum(rate(traefik_router_request_duration_seconds_bucket{job=\"traefik\",router=~\"production-wikibase-.*@kubernetescrd\"}[$__rate_interval])) by (le))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum(rate(traefik_router_request_duration_seconds_bucket{job=\"traefik\",router=~\"production-wikibase-.*@kubernetescrd\"}[$__rate_interval])) by (le))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 26,
          "title": "HTTP 200 request latency",
          "description": "Traefik end-to-end request latency for successful HTTP 200 responses only. The 5-second threshold marks the initial latency objective; percentiles do not prove that every response is below the threshold.",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 22, "w": 12, "h": 7 },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "max": 10,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 5 }
                ]
              }
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.50, sum(rate(traefik_router_request_duration_seconds_bucket{job=\"traefik\",router=~\"production-wikibase-.*@kubernetescrd\",code=\"200\"}[$__rate_interval])) by (le))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum(rate(traefik_router_request_duration_seconds_bucket{job=\"traefik\",router=~\"production-wikibase-.*@kubernetescrd\",code=\"200\"}[$__rate_interval])) by (le))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum(rate(traefik_router_request_duration_seconds_bucket{job=\"traefik\",router=~\"production-wikibase-.*@kubernetescrd\",code=\"200\"}[$__rate_interval])) by (le))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 27,
          "title": "HTTP 200 responses over 5 seconds",
          "description": "Number of completed HTTP 200 responses slower than 5 seconds in the rolling 5-minute window. Zero means no such response was observed in that window.",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 22, "w": 12, "h": 7 },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          },
          "targets": [{
            "refId": "A",
            "expr": "clamp_min(sum(increase(traefik_router_request_duration_seconds_count{job=\"traefik\",router=~\"production-wikibase-.*@kubernetescrd\",code=\"200\"}[5m])) - sum(increase(traefik_router_request_duration_seconds_bucket{job=\"traefik\",router=~\"production-wikibase-.*@kubernetescrd\",code=\"200\",le=\"5.0\"}[5m])), 0)",
            "legendFormat": "over 5s"
          }]
        },
        {
          "id": 5,
          "title": "Traefik open connections",
          "description": "Entrypoint-wide connection count. This includes services other than the portal and becomes the outer backpressure signal once a global in-flight limit is configured.",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 29, "w": 12, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "none", "min": 0 } },
          "targets": [{
            "refId": "A",
            "expr": "sum(traefik_open_connections{job=\"traefik\",entrypoint=\"websecure\"})",
            "legendFormat": "websecure"
          }]
        },
        {
          "id": 7,
          "title": "Gateway failure rate",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 29, "w": 12, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "reqps", "min": 0 } },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (code) (rate(traefik_router_requests_total{job=\"traefik\",router=~\"production-wikibase-.*@kubernetescrd\",code=~\"502|503|504\"}[$__rate_interval]))",
              "legendFormat": "{{code}}"
            }
          ]
        },
        {
          "id": 8,
          "title": "PHP-FPM layer",
          "type": "row",
          "gridPos": { "x": 0, "y": 44, "w": 24, "h": 1 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 9,
          "title": "MediaWiki CPU",
          "description": "CPU use is useful context but does not determine whether the PHP-FPM pool is full; workers waiting on dependencies can consume a slot without consuming CPU.",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 45, "w": 8, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "cores", "min": 0 } },
          "targets": [{
            "refId": "A",
            "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"production\",pod=~\"wikibase-[^-]+-[^-]+\",container=\"mediawiki\"}[$__rate_interval]))",
            "legendFormat": "aggregate"
          }]
        },
        {
          "id": 10,
          "title": "MediaWiki memory limit usage",
          "type": "timeseries",
          "gridPos": { "x": 8, "y": 45, "w": 8, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1 } },
          "targets": [{
            "refId": "A",
            "expr": "sum(container_memory_working_set_bytes{namespace=\"production\",pod=~\"wikibase-[^-]+-[^-]+\",container=\"mediawiki\"}) / sum(kube_pod_container_resource_limits{namespace=\"production\",pod=~\"wikibase-[^-]+-[^-]+\",container=\"mediawiki\",resource=\"memory\",unit=\"byte\"})",
            "legendFormat": "aggregate"
          }]
        },
        {
          "id": 11,
          "title": "Wikibase container restarts",
          "description": "Unexpected restarts by container. PHP-FPM and Apache should remain at zero when the admission limit is reached.",
          "type": "timeseries",
          "gridPos": { "x": 16, "y": 45, "w": 8, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "none", "min": 0 } },
          "targets": [{
            "refId": "A",
            "expr": "sum by (container) (kube_pod_container_status_restarts_total{namespace=\"production\",pod=~\"wikibase-[^-]+-[^-]+\"})",
            "legendFormat": "{{container}}"
          }]
        },
        {
          "id": 12,
          "title": "Apache worker utilization",
          "description": "Aggregate busy Apache workers divided by all configured slots. Apache keeps one additional worker per pod beyond PHP-FPM capacity for monitoring and health checks, so PHP-FPM can be full slightly before this reaches 100%.",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 52, "w": 8, "h": 7 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.8 },
                  { "color": "red", "value": 0.95 }
                ]
              }
            }
          },
          "targets": [{
            "refId": "A",
            "expr": "sum(apache_workers{namespace=\"production\",state=\"busy\"}) / sum(apache_scoreboard{namespace=\"production\"})",
            "legendFormat": "aggregate"
          }]
        },
        {
          "id": 20,
          "title": "Busy Apache workers",
          "description": "Aggregate busy workers. Busy and idle workers add up to the configured worker capacity, so the idle series is omitted.",
          "type": "timeseries",
          "gridPos": { "x": 8, "y": 52, "w": 8, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "none", "min": 0 } },
          "targets": [{
            "refId": "A",
            "expr": "sum(apache_workers{namespace=\"production\",state=\"busy\"})",
            "legendFormat": "busy"
          }]
        },
        {
          "id": 21,
          "title": "All Apache metrics targets available",
          "description": "1 only when every Apache exporter target is being scraped successfully.",
          "type": "stat",
          "gridPos": { "x": 16, "y": 52, "w": 8, "h": 7 },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [{
                "type": "value",
                "options": {
                  "0": { "text": "Down", "color": "red" },
                  "1": { "text": "Up", "color": "green" }
                }
              }]
            }
          },
          "targets": [{
            "refId": "A",
            "expr": "min(up{job=\"production/wikibase-apache\"})",
            "legendFormat": "all targets"
          }],
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 13,
          "title": "Varnish layer",
          "type": "row",
          "gridPos": { "x": 0, "y": 36, "w": 24, "h": 1 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 14,
          "title": "Varnish memory limit usage",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 37, "w": 8, "h": 7 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.8 },
                  { "color": "red", "value": 0.9 }
                ]
              }
            }
          },
          "targets": [{
            "refId": "A",
            "expr": "sum(container_memory_working_set_bytes{namespace=\"production\",pod=~\"varnish-.*\",container=\"varnish-cache\"}) / sum(kube_pod_container_resource_limits{namespace=\"production\",pod=~\"varnish-.*\",container=\"varnish-cache\",resource=\"memory\",unit=\"byte\"})",
            "legendFormat": "aggregate"
          }]
        },
        {
          "id": 15,
          "title": "Varnish CPU",
          "type": "timeseries",
          "gridPos": { "x": 8, "y": 37, "w": 8, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "cores", "min": 0 } },
          "targets": [{
            "refId": "A",
            "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"production\",pod=~\"varnish-.*\",container=\"varnish-cache\"}[$__rate_interval]))",
            "legendFormat": "aggregate"
          }]
        },
        {
          "id": 16,
          "title": "Varnish backend saturation",
          "description": "Current connections divided by each pool's limit. Anonymous capacity stops one worker short per Apache pod, minus the anonymous search pool; the reserved connections form the authenticated pool. A full search pool only rejects searches, so the Varnish overview ignores it.",
          "type": "timeseries",
          "gridPos": { "x": 16, "y": 37, "w": 8, "h": 7 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.8 },
                  { "color": "red", "value": 0.95 }
                ]
              }
            }
          },
          "targets": [{
            "refId": "A",
            "expr": "sum by (backend) (varnish_backend_conn{namespace=\"production\",backend=~\"anon|default|search\"}) / on (backend) mardi_varnish_backend_max_connections{namespace=\"production\"}",
            "legendFormat": "{{backend}}"
          }]
        }
      ],
      "schemaVersion": 39,
      "version": 6
    }
