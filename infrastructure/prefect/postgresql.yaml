apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql
  namespace: prefect
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  storage:
    size: 20Gi
  bootstrap:
    initdb:
      database: server
      owner: prefect
      secret:
        name: prefect-server-postgresql
  monitoring:
    enablePodMonitor: true
  enablePDB: false
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
