{{- if .Values.wikiProxy.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-wiki-proxy
spec:
  # A single replica on purpose: max_conns is enforced per nginx instance, so
  # every extra replica would multiply the load allowed onto QLever.
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-wiki-proxy
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-wiki-proxy
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/wiki-proxy-config.yaml") . | sha256sum }}
    spec:
      containers:
        - name: nginx
          image: {{ .Values.wikiProxy.image }}
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: cache
              mountPath: /var/cache/nginx
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            {{- toYaml .Values.wikiProxy.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-wiki-proxy-config
        - name: cache
          emptyDir:
            sizeLimit: {{ .Values.wikiProxy.cache.volumeSize }}
{{- end }}
