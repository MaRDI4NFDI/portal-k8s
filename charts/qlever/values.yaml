qlever:
  image:
    repository: adfreiburg/qlever
    tag: latest
  port: 7001
  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  storage: 
    size: "5Gi"
    className: "csi-rbd-sc"
  data:
    name: mardi
    description: MaRDI Knowledge Graph
    textDescription: All literals, search with FILTER CONTAINS(?var, "...")
  index:
    inputFiles: "wikidump-*.ttl.gz"
    catInputFiles: "zcat ${INPUT_FILES}"
  server:
    memoryForQueries: 5G
    cacheMaxSize: 2G
    timeout: 30s
  ui:
    config: mardi

frontend:
  image:
    repository: adfreiburg/qlever-ui
    tag: latest
  port: 7000
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "400m"
  storage: "300Mi"

updater:
  enabled: false
  qleverControlRef: "v0.6.0"
  sseStreamUrl: "http://eventstreams/v2/stream/rdf-streaming-updater.mutation.v2"
  topic: "mardi.rdf-streaming-updater.mutation.v2"
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 2Gi

resync:
  enabled: false
  entityDataUrl: "http://wikibase/wiki/Special:EntityData/"
  apiUrl: "http://wikibase/w/api.php"
  namespaces: "120,122"
  conceptUri: ""
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

ingress:
  enabled: false
  subdomain: "qlever"

# Limits for the public endpoint (qlever.<baseDomain>/sparql), which shares
# QLever with the wiki.
readonlyProxy:
  # Queries running at once across all public clients. More are answered
  # with 503 and Retry-After.
  maxConns: 3
  # Concurrent queries per client address. More are answered with 429.
  maxConnsPerClient: 2
  # Keep slightly above qlever.server.timeout.
  readTimeout: 330s

# Internal proxy the wiki's SPARQL extension talks to instead of QLever itself.
# It caps concurrent wiki queries and serves results from cache, including
# stale results while QLever is saturated. Point MediaWiki at
# http://<release>-wiki-proxy:8080 once it is enabled.
wikiProxy:
  enabled: false
  image: nginx:1.27-alpine
  # Wiki queries running on QLever at once. Anything beyond is served from
  # cache or fails immediately; it never waits for a slot.
  maxConns: 8
  # Upper bound for one query. The SPARQL extension also asks QLever to cancel
  # queries earlier (timeout parameter), so this only catches a hung backend.
  readTimeout: 10s
  # Largest query accepted. The body is part of the cache key and has to fit
  # into a single memory buffer.
  maxBodySize: 256k
  cache:
    # How long a result is served without asking QLever again.
    ttl: 1h
    # How long an unused result is kept for stale fallback.
    inactive: 24h
    maxSize: 512m
    volumeSize: 1Gi
    # How long identical concurrent misses wait for the first request.
    lockTimeout: 3s
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

