qlever:
  image:
    repository: adfreiburg/qlever
    tag: latest
  port: 7001
  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  storage: 
    size: "5Gi"
    className: "csi-rbd-sc"
  data:
    name: mardi
    description: MaRDI Knowledge Graph
    textDescription: All literals, search with FILTER CONTAINS(?var, "...")
  index:
    # Chunks produced by the WDQS munger (munge.sh), relative to /data.
    inputFiles: "wikidump-*.ttl.gz"
    catInputFiles: "zcat ${INPUT_FILES}"
  server:
    memoryForQueries: 5G
    cacheMaxSize: 2G
    timeout: 30s
  ui:
    config: mardi

frontend:
  image:
    repository: adfreiburg/qlever-ui
    tag: latest
  port: 7000
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "400m"
  storage: "300Mi"

updater:
  enabled: false
  # Tag or commit of qlever-dev/qlever-control installed at pod start.
  qleverControlRef: "v0.6.0"
  sseStreamUrl: "http://eventstreams/v2/stream/rdf-streaming-updater.mutation.v2"
  topic: "mardi.rdf-streaming-updater.mutation.v2"
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 2Gi

resync:
  enabled: false
  entityDataUrl: "http://wikibase/wiki/Special:EntityData/"
  apiUrl: "http://wikibase/w/api.php"
  namespaces: "120,122"
  conceptUri: ""
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

ingress:
  enabled: false
  subdomain: "qlever"

