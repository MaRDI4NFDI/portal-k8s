# This file documents the required secrets for this chart
# The actual secrets should be created externally (e.g., via Kustomize)
# and must be named go-away-key
#
# 32 byte ed25519 seed in hex, used to sign challenge JWTs. Generate one with:
#   docker run --rm ghcr.io/weebdatahoarder/go-away:latest go-away --jwt-private-key-seed generate
# Without it go-away generates a random seed on every start, invalidating all
# outstanding challenges on restart.

apiVersion: v1
kind: Secret
metadata:
  name: go-away-key
type: Opaque
data:
  GOAWAY_JWT_PRIVATE_KEY_SEED: <base64-encoded-hex-seed>
