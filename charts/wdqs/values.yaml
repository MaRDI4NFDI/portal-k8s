wdqs:
  image:
    repository: wikibase/wdqs
    tag: 2@sha256:f6416c4f2d253969b63d5ff40cc61db2897197e24f1c472dd2068603423846b6
  host: wdqs
  port: 9999
  storage: 5Gi
  memory: ""
  heap_size: "1g"
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 2
      memory: 4Gi
  opts: "-Dorg.wikidata.query.rdf.tool.rdf.RdfRepository.timeout=3600"

updater:
  enabled: true
  wikibaseHost: "wikibase"
  wikibaseScheme: "http"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  opts: "-Dorg.wikidata.query.rdf.tool.wikibase.WikibaseRepository.timeout=30000"

frontend:
  image:
    repository: wikibase/wdqs-frontend
    tag: 2@sha256:6e51acf52f274c3127386a2d5a670112d417dce53745601fe678239a79358a15
  replicas: 2
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

wikibase:
  host: wikibase
  scheme: https

prefix:
  scheme: https

ingress:
  enabled: true
  subdomain: "query"

