# Image
image:
  repository: apache/kafka
  tag: 4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837

# Cluster sizing
replicaCount: 3
replicationFactor: 3
minIsr: 2

# Resources per broker
storage: 20Gi
resources:
  requests:
    cpu: "250m"
    memory: "1Gi"
  limits:
    cpu: "1000m"
    memory: "1Gi"
heapOpts: "-Xmx512M -Xms512M"

secrets: "kafka-secrets"
 
# Topic settings
autoCreateTopics: true
numPartitions: 3
 
# Log retention
logRetentionHours: 4
logRetentionBytes: 1073741824   # 1Gi
logSegmentBytes: 134217728      # 128Mi
logRetentionCheckIntervalMs: 300000

antiAffinity: "hard"