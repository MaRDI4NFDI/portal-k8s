mediawiki:
  image:
    repository: ghcr.io/mardi4nfdi/wikibase
    tag: latest
    pullPolicy: Always
  replicas: 1
  port: 9000
  scheme: https
  db_server: mariadb
  db_name: my_wiki
  db_user: sqluser
  db_primary: mariadb-0
  db_secondary: mariadb-1
  elasticsearch_host: elasticsearch
  elasticsearch_port: 9200
  redis_host: redis-master
  redis_port: 6379
  memcached_host: memcached
  memcached_port: 11211
  latexml_host: latexml
  latexml_port: 80
  formulasearch_host: formulasearch
  formulasearch_port: 1985
  importerEndpoint: importer
  phpfpm:
    pm: dynamic
    maxChildren: 75
    startServers: 25
    minSpareServers: 10
    maxSpareServers: 40
    maxRequests: 1000
    requestTimeout: "60s"
    slowlogTimeout: "0"
  opcache:
    memoryConsumption: 256
    maxAcceleratedFiles: 20000
    internedStringsBuffer: 16
    validateTimestamps: 1
    revalidateFreq: 60
    jitBufferSize: "64M"
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi

apache:
  # Keep Apache able to serve status and health checks while every PHP-FPM
  # child is occupied. Varnish admission remains capped at PHP-FPM capacity.
  monitoringWorkers: 1
  image:
    repository: ghcr.io/mardi4nfdi/apache-assets
    # uses tag from mediawiki to ensure compatibility
    pullPolicy: Always
  port: 80
  metrics:
    enabled: false
    image:
      repository: docker-registry.wikimedia.org/prometheus-apache-exporter
      tag: "0.0.4-20260916@sha256:3581cdfa07eedbb51e526b65389bd95ec62afe87618112df4bb3836aae4058e6"
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi

jobrunner:
  replicas: 1
  apache:
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  mediawiki:
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2
        memory: 2Gi
  phpfpm:
    pm: static
    maxChildren: 5
    maxRequests: 500
    requestTimeout: 300s
    startServers: 0
    minSpareServers: 0
    maxSpareServers: 0

varnish:
  enabled: false
  fullnameOverride: "varnish"
  backendFirstByteTimeout: "600s"
  anonBackendFirstByteTimeout: "10s"
  backendBetweenBytesTimeout: "600s"
  searchConnectionsPerReplica: 10
  searchBackendFirstByteTimeout: "30s"
  purgeAcl: "10.0.0.0/8"
  # How long entity redirects (Special:EntityPage/*, /entity/*) may be cached.
  entityRedirectTtl: "24h"
  # Size of the in-memory object store, appended to varnishd as
  # "-s malloc,<size>". Varnish defaults to roughly 100 MB without it.
  # This bounds object storage only. Thread stacks, the VSM and per-request
  # workspaces add several hundred MB on top, so keep it well below the
  # container's memory limit rather than close to it.
  cacheSize: "1g"
  # Upper bound for Varnish's Transient store (short-lived objects and bodies
  # of passed responses), appended as "-s Transient=malloc,<size>". Without
  # it Transient storage is unbounded.
  transientSize: "256m"
  metrics:
    enabled: false
    image:
      repository: ghcr.io/mardi4nfdi/varnish-exporter
      tag: "0.1.0@sha256:c0cd8303a3641be68d0423efbde4005a3a3d47b4d8a9e7ce494e7b7764d936bb"
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
  # Size memory with the store: measured on production, per-object
  # bookkeeping and allocator overhead added about the store size again on
  # top of cacheSize. 1g store + ~1 GiB overhead + 256m Transient.
  resources:
    requests:
      cpu: 250m
      memory: 1536Mi
    limits:
      cpu: 1000m
      memory: 2560Mi

blockHeaders:
  enabled: false
fail2ban:
  enabled: false
  denylist: []
secrets:
  mariadb: mariadb-secrets

ingress:
  enabled: true
  # Optional hostnames for the main Traefik IngressRoute Host() rule.
  # Defaults to global.baseDomain when empty.
  routeHosts: []
  # Additional host groups. Each group gets its own IngressRoute and TLS
  # certificate so large host sets can stay below Let's Encrypt limits.
  # Use either hosts: [...] or domain + prefixes.
  extraHostGroups: []
