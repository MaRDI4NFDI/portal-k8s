{{- if .Values.varnish.enabled }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .Release.Name }}-varnish
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: varnish
    namespace: flux-system
  values:
    fullnameOverride: {{ .Values.varnish.fullnameOverride }}
    server:
      replicas: 1

      vclConfig: |
        vcl 4.0;

        # Split the fixed PHP-FPM capacity between authenticated, anonymous and
        # anonymous search traffic. One connection per Apache pod remains
        # reserved for logged-in users and a few more for anonymous searches,
        # while all backend limits still add up to the total worker count.
        backend default {
            .host = "{{ .Release.Name }}";
            .port = "{{ .Values.apache.port }}";
            .max_connections = {{ .Values.mediawiki.replicas }};
            .first_byte_timeout = {{ .Values.varnish.backendFirstByteTimeout }};
            .between_bytes_timeout = {{ .Values.varnish.backendBetweenBytesTimeout }};
        }
        backend anon {
            .host = "{{ .Release.Name }}";
            .port = "{{ .Values.apache.port }}";
            .max_connections = {{ mul .Values.mediawiki.replicas (sub (sub .Values.mediawiki.phpfpm.maxChildren 1) .Values.varnish.searchConnectionsPerReplica) }};
            .first_byte_timeout = {{ .Values.varnish.anonBackendFirstByteTimeout }};
            .between_bytes_timeout = {{ .Values.varnish.backendBetweenBytesTimeout }};
        }
        # Crawlers submitting the search form produced searches that outlived
        # the anonymous timeout and filled the whole anonymous pool, so every
        # anonymous page view got a 503. Anonymous searches now saturate only
        # this pool. Its first-byte timeout is longer than the anonymous one
        # because PHP keeps running a search after Varnish gives up: a short
        # timeout would free slots while workers are still busy and let more
        # searches reach PHP than the pool allows.
        backend search {
            .host = "{{ .Release.Name }}";
            .port = "{{ .Values.apache.port }}";
            .max_connections = {{ mul .Values.mediawiki.replicas .Values.varnish.searchConnectionsPerReplica }};
            .first_byte_timeout = {{ .Values.varnish.searchBackendFirstByteTimeout }};
            .between_bytes_timeout = {{ .Values.varnish.backendBetweenBytesTimeout }};
        }

        # ACL for purge operations
        acl purge {
            "{{ .Values.varnish.purgeAcl }}";
            "127.0.0.1";
        }

        sub vcl_recv {
            # Set X-Forwarded-For header
            if (req.http.X-Forwarded-For) {
                set req.http.X-Forwarded-For = req.http.X-Forwarded-For + ", " + client.ip;
            } else {
                set req.http.X-Forwarded-For = client.ip;
            }

            # Detect authenticated users once: Authorization header or MediaWiki login cookies.
            # Cookie names are anchored per RFC 6265 ("; " separator, "=" directly after name)
            # to avoid false positives from unrelated cookies containing similar substrings.
            # Explicitly unset in the else branch to prevent stale values on reused request objects.
            if (req.http.Authorization ||
                req.http.Cookie ~ "(^|;\s*)(my_wiki_session|my_wikiToken|my_wikiUserID|my_wikiUserName)=") {
                set req.http.X-Is-Authenticated = "1";
            } else {
                unset req.http.X-Is-Authenticated;
            }

            # Logged-in users' searches stay in the default pool; only
            # anonymous searches use the search pool.
            if (req.http.X-Is-Authenticated) {
                set req.backend_hint = default;
            } elsif (req.url ~ "Special(:|%3[Aa])Search" || req.url ~ "^/w/index\.php\?(.*&)?search=") {
                set req.backend_hint = search;
            } else {
                set req.backend_hint = anon;
            }

            # Handle PURGE requests
            if (req.method == "PURGE") {
                if (!client.ip ~ purge) {
                    return (synth(405, "Not allowed."));
                } else {
                    return (purge);
                }
            }

            # Pass POST requests to backend
            if (req.method == "POST") {
                return (pass);
            }

            # Pass requests from logged-in users
            if (req.http.X-Is-Authenticated) {
                return (pass);
            }

            # Normalize Accept-Encoding
            if (req.http.Accept-Encoding) {
                if (req.http.User-Agent ~ "MSIE 6") {
                    unset req.http.Accept-Encoding;
                } elsif (req.http.Accept-Encoding ~ "gzip") {
                    set req.http.Accept-Encoding = "gzip";
                } elsif (req.http.Accept-Encoding ~ "deflate") {
                    set req.http.Accept-Encoding = "deflate";
                } else {
                    unset req.http.Accept-Encoding;
                }
            }

            # Block expensive uncacheable pages for anonymous users
            # (authenticated users have already been passed above).
            # req.url is not decoded, so also match the %3A form that
            # /w/index.php?title=Special%3AWhatLinksHere&target=... uses.
            if (req.url ~ "(Special(:|%3[Aa])(RecentChangesLinked|WhatLinksHere|ExportRDF|Log)|action=history|action=info|action=edit)") {
                return (synth(753, "You must be logged in to view this page"));
            }

            return (hash);
        }

        sub vcl_backend_fetch {
            # X-Is-Authenticated is an internal Varnish routing flag used only for backend
            # selection and pass decisions. Unset it here so it is never forwarded to the
            # backend application, which has no use for it and should not rely on it.
            unset bereq.http.X-Is-Authenticated;
        }

        sub vcl_backend_response {
            # Preserve stale content when a background refresh returns an error.
            if (bereq.is_bgfetch && beresp.status >= 500) {
                return (abandon);
            }

            # Don't cache error responses
            if (beresp.status >= 500) {
                set beresp.uncacheable = true;
                return (deliver);
            }
            
            # MediaWiki emits "s-maxage" for anonymous views but attaches a
            # Set-Cookie to the very same response, which the Set-Cookie rule below
            # then treats as uncacheable. In production this left the cache almost
            # empty - 6328 objects stored in 14 days against 17.1M misses - so a
            # distributed crawl reached MediaWiki almost unfiltered. Drop the cookie
            # for anonymous, side-effect-free entity and article views so they cache
            # as MediaWiki intended. Responses marked private, no-cache or no-store
            # are never touched, and no TTL is invented here: the backend's own
            # s-maxage still decides how long the object lives.
            if (bereq.method == "GET" &&
                !bereq.http.Authorization &&
                beresp.http.Cache-Control !~ "(private|no-cache|no-store)" &&
                bereq.url !~ "(Special:UserLogin|Special:UserLogout|Special:CreateAccount|Special:Preferences|action=|title=Special:)" &&
                (bereq.url ~ "^/wiki/" || bereq.url ~ "^/entity/")) {
                unset beresp.http.Set-Cookie;

                # Special:EntityPage/* and /entity/* reply with a redirect that
                # depends only on the entity id. They were 23% of all requests during
                # the crawl, each one waking PHP just to emit a Location header.
                if (beresp.status == 301 || beresp.status == 302 || beresp.status == 303) {
                    set beresp.ttl = {{ .Values.varnish.entityRedirectTtl }};
                }
            }

            # Don't cache if no TTL
            if (!beresp.ttl > 0s) {
                set beresp.uncacheable = true;
                return (deliver);
            }
            
            # Don't cache Set-Cookie responses
            if (beresp.http.Set-Cookie) {
                set beresp.uncacheable = true;
                return (deliver);
            }
            
            # Don't cache private content
            if (beresp.http.Authorization && !beresp.http.Cache-Control ~ "public") {
                set beresp.uncacheable = true;
                return (deliver);
            }
            
            # Retain successful cacheable responses for outage fallback.
            if (beresp.status == 200) {
                set beresp.grace = 24h;
            }

            # Fall through to built-in VCL for remaining cacheability checks,
            # including Cache-Control: private, no-cache and no-store.
        }

        sub vcl_pipe {
            set req.http.connection = "close";
        }

        sub vcl_backend_error {
            # Connection failures must not replace stale content.
            if (bereq.is_bgfetch) {
                return (abandon);
            }

            set beresp.http.Content-Type = "text/html; charset=utf-8";
            set beresp.http.Retry-After = "30";
            set beresp.ttl = 30s;
            set beresp.grace = 15s;
            synthetic({"<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>MaRDI Portal - Temporarily Unavailable</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a5f7a;color:white;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 2rem 10rem}.sorry{font-size:.78rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.65);margin-bottom:1rem}h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:900;text-transform:uppercase;line-height:1.1}.banner{background:#e8601c;width:100vw;padding:1.4rem 2rem;font-size:1.35rem;font-weight:600;line-height:1.5;position:fixed;bottom:0;left:0}.debug{font-size:.65rem;opacity:.45;margin-top:.6rem;font-family:monospace;font-weight:400;line-height:1.6}</style></head><body><svg width='80' height='74' viewBox='0 0 90 83' fill='none' xmlns='http://www.w3.org/2000/svg' style='margin-bottom:1.4rem'><polygon points='45,4 87,80 3,80' fill='#e8601c' stroke='white' stroke-width='3.5' stroke-linejoin='round'/><rect x='42' y='28' width='6' height='24' rx='3' fill='white'/><rect x='42' y='59' width='6' height='7' rx='3' fill='white'/></svg><p class='sorry'>Sorry for any inconvenience</p><h1>The MaRDI Portal<br>is down</h1><div class='banner'>Our IT team is working hard to have it running again as soon as possible!<div class='debug'>Error "} + beresp.status + {" "} + beresp.reason + {"&nbsp;&nbsp;|&nbsp;&nbsp;Backend fetch failed&nbsp;&nbsp;|&nbsp;&nbsp;XID: "} + bereq.xid + {"&nbsp;&nbsp;|&nbsp;&nbsp;Varnish cache server</div></div></body></html>"});
            return (deliver);
        }

        sub vcl_synth {
            if (resp.status == 753) {
                set resp.status = 403;
                set resp.reason = "Forbidden";
                set resp.http.Content-Type = "text/plain; charset=utf-8";
                synthetic("You must be logged in to view this page.");
                return (deliver);
            }
            if (resp.status == 405) {
                set resp.http.Content-Type = "text/plain; charset=utf-8";
                synthetic("Not allowed.");
                return (deliver);
            }
            set resp.http.Content-Type = "text/html; charset=utf-8";
            synthetic({"<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>MaRDI Portal - Temporarily Unavailable</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a5f7a;color:white;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 2rem 10rem}.sorry{font-size:.78rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.65);margin-bottom:1rem}h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:900;text-transform:uppercase;line-height:1.1}.banner{background:#e8601c;width:100vw;padding:1.4rem 2rem;font-size:1.35rem;font-weight:600;line-height:1.5;position:fixed;bottom:0;left:0}.debug{font-size:.65rem;opacity:.45;margin-top:.6rem;font-family:monospace;font-weight:400;line-height:1.6}</style></head><body><svg width='80' height='74' viewBox='0 0 90 83' fill='none' xmlns='http://www.w3.org/2000/svg' style='margin-bottom:1.4rem'><polygon points='45,4 87,80 3,80' fill='#e8601c' stroke='white' stroke-width='3.5' stroke-linejoin='round'/><rect x='42' y='28' width='6' height='24' rx='3' fill='white'/><rect x='42' y='59' width='6' height='7' rx='3' fill='white'/></svg><p class='sorry'>Sorry for any inconvenience</p><h1>The MaRDI Portal<br>is down</h1><div class='banner'>Our IT team is working hard to have it running again as soon as possible!<div class='debug'>Error "} + resp.status + {" "} + resp.reason + {"&nbsp;&nbsp;|&nbsp;&nbsp;XID: "} + req.xid + {"&nbsp;&nbsp;|&nbsp;&nbsp;Varnish cache server</div></div></body></html>"});
            return (deliver);
        }
      
      resources:
        requests:
          cpu: {{ .Values.varnish.resources.requests.cpu }}
          memory: {{ .Values.varnish.resources.requests.memory }}
        limits:
          cpu: {{ .Values.varnish.resources.limits.cpu }}
          memory: {{ .Values.varnish.resources.limits.memory }}

      # Size of the in-memory object store. The chart runs varnishd through an
      # explicit command, so the image entrypoint never runs and VARNISH_SIZE is
      # ignored; the size has to be appended to the daemon's own arguments.
      # Without it varnishd falls back to its ~100 MB built-in default.
      #
      # Transient storage is a second store that holds short-lived objects,
      # hit-for-miss markers and the bodies of passed or uncacheable responses
      # while they are delivered. It is unbounded unless sized explicitly, so
      # under a flood of uncacheable requests it grows until the container is
      # OOM-killed and the whole cache is lost.
      extraArgs:
        - "-s"
        - "malloc,{{ .Values.varnish.cacheSize }}"
        - "-s"
        - "Transient=malloc,{{ .Values.varnish.transientSize }}"

      {{- if .Values.varnish.metrics.enabled }}
      extraContainers: |
        - name: varnish-exporter
          image: "{{ .Values.varnish.metrics.image.repository }}:{{ .Values.varnish.metrics.image.tag }}"
          ports:
            - name: varnish-metrics
              containerPort: 9131
          volumeMounts:
            - name: {{ "{{ .Release.Name }}" }}-varnish-vsm
              mountPath: /var/lib/varnish
              readOnly: true
          resources:
            {{- toYaml .Values.varnish.metrics.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          readinessProbe:
            tcpSocket:
              port: varnish-metrics
          livenessProbe:
            tcpSocket:
              port: varnish-metrics
      {{- end }}
      
      service:
        enabled: true
        type: ClusterIP
        http:
          enabled: true
          port: 80
      
      ingress:
        enabled: false
{{- end }}
