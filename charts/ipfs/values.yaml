storage:
  className: csi-rbd-sc
  size: 20Gi

# Gateway route, certificate, swarm routes and announced addresses.
public: true

rpc:
  # Lets other pods add files on Service port 5001 with the bearer token from
  # tokenSecret. Kubo then requires a token on every API call, also from
  # localhost; D-LOCKSS gets its own token, generated in the IPFS repo.
  inCluster: false
  tokenSecret:
    name: ""
    key: ""

dlockss:
  enabled: false
  nodeName: mardi
  # Further DLOCKSS_* settings, e.g. to keep a test node out of the production network.
  env: {}
  trustedPeers: []
  # Routes POST https://ipfs.<baseDomain>/upload to D-LOCKSS (needs public).
  # D-LOCKSS accepts only files signed with a key the wiki trusts, and
  # refuses all uploads while DLOCKSS_WIKI_API is unset.
  publicUpload: false
  storage:
    size: 5Gi
  image:
    repository: ghcr.io/gipplab/dlockss-single-node
    tag: "15716c8"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

admin:
  enabled: false
  hostname: ""
  existingSecret: ipfs-oauth2-proxy
  allowedEmailSecrets: []
  secretRevision: ""
  image:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: v7.15.3
    pullPolicy: IfNotPresent
  cookieExpire: 8h
  cookieRefresh: 1h
  resources: {}
