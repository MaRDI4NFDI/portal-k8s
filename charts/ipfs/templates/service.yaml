apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: gateway
      port: 8080
    {{- if .Values.admin.enabled }}
    - name: admin
      port: 4180
      targetPort: admin
    {{- end }}
    - name: swarm-tcp
      port: 4001
    - name: swarm-udp
      port: 4001
      protocol: UDP
