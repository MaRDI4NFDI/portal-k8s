apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: gateway
      port: 8080
    {{- if .Values.rpc.inCluster }}
    - name: rpc
      port: 5001
      targetPort: rpc
    {{- end }}
    {{- if .Values.admin.enabled }}
    - name: admin
      port: 4180
      targetPort: admin
    {{- end }}
    {{- if and .Values.public .Values.dlockss.enabled .Values.dlockss.publicUpload }}
    - name: dlockss
      port: 5050
    {{- end }}
    - name: swarm-tcp
      port: 4001
    - name: swarm-udp
      port: 4001
      protocol: UDP
