{{- if and .Values.admin.enabled (empty .Values.admin.allowedEmailSecrets) }}
{{- fail "admin.allowedEmailSecrets must contain at least one Secret when admin access is enabled" }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
      annotations:
        checksum/init-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.admin.enabled }}
        ipfs-admin-secret-revision: {{ .Values.admin.secretRevision | quote }}
        {{- end }}
    spec:
      {{- if .Values.admin.enabled }}
      initContainers:
        - name: assemble-oauth2-allowlist
          image: busybox:1.37
          command:
            - /bin/sh
            - -ec
          args:
            - cat /input/* > /output/allowed-emails
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: oauth2-proxy-email-inputs
              mountPath: /input
              readOnly: true
            - name: oauth2-proxy
              mountPath: /output
      {{- end }}
      containers:
        - name: kubo
          image: ipfs/kubo
          env:
            - name: IPFS_PROFILE
              value: server
          volumeMounts:
            - name: data
              mountPath: /data/ipfs
            - name: init
              mountPath: /container-init.d/10-configure.sh
              subPath: 10-configure.sh
              readOnly: true
        {{- if .Values.admin.enabled }}
        - name: oauth2-proxy
          image: "{{ .Values.admin.image.repository }}:{{ .Values.admin.image.tag }}"
          imagePullPolicy: {{ .Values.admin.image.pullPolicy }}
          args:
            - --provider=google
            - --scope=openid email profile
            - --http-address=0.0.0.0:4180
            - --upstream=http://127.0.0.1:5001/
            - --redirect-url=https://{{ default (printf "ipfs-admin.%s" .Values.global.baseDomain) .Values.admin.hostname }}/oauth2/callback
            - --authenticated-emails-file=/etc/oauth2-proxy/allowed-emails
            - --reverse-proxy=true
            - --cookie-samesite=lax
            - --cookie-name=__Host-ipfs-admin
            - --cookie-expire={{ .Values.admin.cookieExpire }}
            - --cookie-refresh={{ .Values.admin.cookieRefresh }}
            - --code-challenge-method=S256
            - --skip-provider-button=true
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.existingSecret }}
                  key: OAUTH2_PROXY_CLIENT_ID
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.existingSecret }}
                  key: OAUTH2_PROXY_CLIENT_SECRET
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.existingSecret }}
                  key: OAUTH2_PROXY_COOKIE_SECRET
          ports:
            - name: admin
              containerPort: 4180
          livenessProbe:
            httpGet:
              path: /ping
              port: admin
          readinessProbe:
            httpGet:
              path: /ready
              port: admin
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          {{- with .Values.admin.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: oauth2-proxy
              mountPath: /etc/oauth2-proxy
              readOnly: true
        {{- end }}
      volumes:
        - name: init
          configMap:
            name: {{ .Release.Name }}-init
            defaultMode: 0555
        {{- if .Values.admin.enabled }}
        - name: oauth2-proxy-email-inputs
          projected:
            sources:
              {{- range $index, $secretName := .Values.admin.allowedEmailSecrets }}
              - secret:
                  name: {{ $secretName }}
                  items:
                    - key: email
                      path: {{ printf "admin-%04d" $index }}
              {{- end }}
        - name: oauth2-proxy
          emptyDir: {}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.storage.className }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
