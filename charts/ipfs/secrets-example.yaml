apiVersion: v1
kind: Secret
metadata:
  name: ipfs-oauth2-proxy
type: Opaque
stringData:
  OAUTH2_PROXY_CLIENT_ID: replace-with-google-client-id
  OAUTH2_PROXY_CLIENT_SECRET: replace-with-google-client-secret
  OAUTH2_PROXY_COOKIE_SECRET: replace-with-random-cookie-secret
  allowed-emails: |
    administrator@example.org
