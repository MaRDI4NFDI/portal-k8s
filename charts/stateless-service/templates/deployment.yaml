apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
    {{- if eq (default "latest" .Values.image.tag) "latest" }}
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    {{- end }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.containerPort }}
          {{ with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{ with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{ with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
