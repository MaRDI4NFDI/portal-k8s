apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: schema-registry
  template:
    metadata:
      labels:
        app: schema-registry
    spec:
      securityContext:
        fsGroup: 65533
      volumes:
        - name: schema-data
          persistentVolumeClaim:
            claimName: schema-registry-data
        - name: nginx-config
          configMap:
            name: schema-registry-nginx-config
      initContainers:
        {{- range $name, $repo := .Values.repos }}
        - name: git-sync-{{ $name }}
          image: "{{ $.Values.gitSync.image.repository }}:{{ $.Values.gitSync.image.tag }}"
          restartPolicy: Always
          args:
            - --repo={{ $repo }}
            - --root=/schemas/repos/{{ $name }}
            - --link=/schemas/{{ $name }}
            - --period={{ $.Values.gitSync.period }}
          startupProbe:
            exec:
              command: ["test", "-e", "/schemas/{{ $name }}/jsonschema"]
            periodSeconds: 5
            failureThreshold: 60
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: schema-data
              mountPath: /schemas
        {{- end }}
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: schema-data
              mountPath: /schemas
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
