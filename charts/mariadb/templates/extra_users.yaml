  {{- end }}
  mariaDbRef:
    name: {{ .Release.Name }}
  passwordSecretKeyRef:
    name: {{ .Values.secrets.importer }}
    key: IMPORTER_DB_PASSWORD
  maxUserConnections: 20
  host: "%"
  cleanupPolicy: Delete
---
