apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: {{ include "mariadb.resourceName" (dict "root" . "name" "msc-user") }}
  namespace: {{ .Release.Namespace }}
spec:
  {{- if .Values.prefixResourceNames }}
  name: msc-user
  {{- end }}
  mariaDbRef:
    name: {{ .Release.Name }}
  passwordSecretKeyRef:
    name: {{ .Values.secrets.wikibase }}
    key: MSC_PASS
  maxUserConnections: 200
  host: "%"
  cleanupPolicy: Delete
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: User
