importer:
  image:
    repository: "ghcr.io/mardi4nfdi/docker-importer"
    tag: "main@sha256:6d06a508676bac8dcf4a0d49c22a1b59088872a3ef7bf92a4e7bbe4a0b8a5de7"
    pullPolicy: Always
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1536Mi"
      cpu: "1000m"

api:
  image:
    repository: "ghcr.io/mardi4nfdi/importer-api"
    tag: "main@sha256:ea92e6d13da9bb09e2273e25880acfc3b6e7134710bc0b475fad9ff766090cb6"
    pullPolicy: Always
  servicePort: 80
  containerPort: 8000
  gunicorn:
    workers: "2"
    threads: "4"
  database:
    poolSize: "5"
    maxOverflow: "3"
  logging:
    level: "info"
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  probes:
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3

database:
  host: "mariadb"
  name: "wikidata-importer"
  user: "importer-user"

endpoints:
  mediawiki: "mardi-wikibase/w/api.php"
  wikibase: "mardi-wikibase"
  sparql: "mardi-wikibase/sparql"
  importerApi: "importer-api"
  wikibase_scheme: "https"

ingress:
  subdomain: "importer"

prefect:
  endpoint: "http://prefect-server:4200/api"
  deployment: "mardi-importer/<deployment_environment>"
