apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb-repl
spec:
  chart:
    spec:
      version: "0.1.50"
  values:
    prefixResourceNames: true
    bootstrapFrom:
      s3:
        bucket: "mardi"
        prefix: "production/physicalbackup/mariadb"
        endpoint: "dasi03.zib.de:9000"
        region: "zib-1"
        accessKeyIdSecretKeyRef:
          name: mariadb-secrets
          key: S3-ACCESS-KEY-ID
        secretAccessKeySecretKeyRef:
          name: mariadb-secrets
          key: S3-SECRET-ACCESS-KEY
        tls:
          enabled: true
      backupContentType: Physical
      stagingStorage:
        persistentVolumeClaim:
          storageClassName: csi-rbd-sc
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 600Gi
    replicas: 2
    replication:
      enabled: true
      replica:
        maxLagSeconds: 30
        recovery:
          enabled: true
    database: my_wiki
    user: sqluser
    mariadb:
      config:
        innodbBufferPoolSize: "8G"
        maxConnections: "1000"
    storage:
      size: 800Gi
      className: csi-rbd-sc
    backup:
      storage: 600Gi
      resources:
        requests:
          cpu: 1000m
          memory: 1Gi
        limits:
          cpu: 4000m
          memory: 2Gi
    physicalbackup:
      enabled: true
      bucket: "mardi"
      prefix: "production/physicalbackup/mariadb-repl"
      endpoint: "dasi03.zib.de:9000"
      region: "zib-1"
      schedule: "0 18 * * *"
      timeout: "30h"
    resources:
      requests:
        cpu: 2000m
        memory: 12Gi
      limits:
        cpu: 8000m
        memory: 16Gi
    secrets:
      mariadb: mariadb-secrets
      wikibase: wikibase-env-secrets
