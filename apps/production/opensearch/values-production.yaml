apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opensearch
spec:
  chart:
    spec:
      version: "0.1.1"
  values:
    image:
      repository: docker-registry.wikimedia.org/repos/search-platform/cirrussearch-opensearch-image
      tag: "v1.3.20-12@sha256:b4de34bcb80208df33a6ebed678c3df8ade1029b06cd7bb198a47589ec8c284d"
    replicas: 1
    storage:
      size: 200Gi
      existingClaim: opensearch-data-ssd
    resources:
      requests:
        memory: "24Gi"
        cpu: "6"
      limits:
        memory: "40Gi"
        cpu: "8"
    javaOpts: "-Xms10g -Xmx10g"
    
