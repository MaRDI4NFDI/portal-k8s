apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wikibase
spec:
  chart:
    spec:
      version: "0.1.101"
  values:
    mediawiki:
      image:
        repository: ghcr.io/mardi4nfdi/wikibase
        tag: 1.47.26
      replicas: 3
      deployment_env: prod
      db_server: mariadb-primary:3306
      db_primary: mariadb-primary
      db_secondary: mariadb-secondary
      elasticsearch_host: opensearch
      redis_host: redis-master
      formulasearch_host: formulasearch
      latexml_host: latexml
      opcache:
        memoryConsumption: 512
        maxAcceleratedFiles: 50000
        internedStringsBuffer: 32
        validateTimestamps: 0
        revalidateFreq: 0
        jitBufferSize: "128M"
      resources:
        requests:
          cpu: "5"
          memory: "4Gi"
        limits:
          cpu: "10"
          memory: "10Gi"
    apache:
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 1
          memory: 3Gi
    jobrunner:
      replicas: 2
      phpfpm:
        maxChildren: 20
      apache:
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      mediawiki:
        resources:
          requests:
            cpu: 6000m
            memory: 4Gi
          limits:
            cpu: 12000m
            memory: 8Gi
    varnish:
      enabled: true
      # "-s malloc,<size>" bounds object bodies only, not the container's total
      # footprint. Per-object bookkeeping, allocator fragmentation, thread
      # stacks and workspaces come on top, and they scale with the number of
      # objects: measured on 2026-09-17 with the 2g store full (141k objects),
      # the container used about 4.0 GiB, roughly the store size again. The
      # previous 4Gi limit left no room, and Varnish was OOM-killed during the
      # 2026-09-16 bot storm, dropping the whole cache mid-incident.
      # Budget: 2g store + ~2 GiB overhead + 256m Transient, within 6Gi.
      # Raise the memory limit by about twice the increase before raising this.
      cacheSize: "2g"
      transientSize: "256m"
      resources:
        requests:
          cpu: 250m
          memory: 4Gi
        limits:
          cpu: 2000m
          memory: 6Gi
    blockHeaders:
      enabled: true
    fail2ban:
      enabled: true
    ingress:
      enabled: true
