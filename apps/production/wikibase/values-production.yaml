apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wikibase
spec:
  chart:
    spec:
      version: "0.1.98"
  values:
    mediawiki:
      image:
        repository: ghcr.io/mardi4nfdi/wikibase
        tag: 1.47.25
      replicas: 3
      deployment_env: prod
      db_server: mariadb-primary:3306
      db_primary: mariadb-primary
      db_secondary: mariadb-secondary
      elasticsearch_host: opensearch
      redis_host: redis-master
      formulasearch_host: formulasearch
      latexml_host: latexml
      opcache:
        memoryConsumption: 512
        maxAcceleratedFiles: 50000
        internedStringsBuffer: 32
        validateTimestamps: 0
        revalidateFreq: 0
        jitBufferSize: "128M"
      resources:
        requests:
          cpu: "5"
          memory: "4Gi"
        limits:
          cpu: "10"
          memory: "10Gi"
    apache:
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 1
          memory: 3Gi
    jobrunner:
      replicas: 2
      phpfpm:
        maxChildren: 20
      apache:
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      mediawiki:
        resources:
          requests:
            cpu: 6000m
            memory: 4Gi
          limits:
            cpu: 12000m
            memory: 8Gi
    varnish:
      enabled: true
      # Only ~270 MB of the previous 1g store was ever used because almost nothing
      # was cacheable; with the Set-Cookie fix the store fills, so give it room
      # inside the existing 4Gi memory limit.
      cacheSize: "3g"
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: 2000m
          memory: 4Gi
    blockHeaders:
      enabled: true
    fail2ban:
      enabled: true
    ingress:
      enabled: true
