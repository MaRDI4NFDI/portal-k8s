apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb
spec:
  install:
    disableWait: true
  upgrade:
    disableWait: true
  chart:
    spec:
      version: "0.1.50"
  values:
    bootstrapFrom:
      s3:
        bucket: "mardi"
        prefix: "production/physicalbackup/mariadb"
        endpoint: "dasi03.zib.de:9000"
        region: "zib-1"
        accessKeyIdSecretKeyRef:
          name: mariadb-secrets
          key: S3-ACCESS-KEY-ID
        secretAccessKeySecretKeyRef:
          name: mariadb-secrets
          key: S3-SECRET-ACCESS-KEY
        tls:
          enabled: true
      backupContentType: Physical
      targetRecoveryTime: "2026-11-21T10:00:00Z"
      stagingStorage:
        persistentVolumeClaim:
          storageClassName: csi-rbd-sc
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1200Gi
    replicas: 2
    replication:
      enabled: true
      replica:
        maxLagSeconds: 30
        recovery:
          enabled: true
    mariadb:
      config:
        innodbBufferPoolSize: "16G"
        maxConnections: "1000"
    database: my_wiki
    user: sqluser
    storage:
      size: 800Gi
      className: csi-rbd-sc-ssd
    backup:
      enabled: false # Use physicalbackups
      bucket: "mardi"
      prefix: "production/mariadb"
      endpoint: "dasi03.zib.de:9000"
      region: "zib-1"
      schedule: "0 0 * * *"
      storage: 600Gi
      resources:
        requests:
          cpu: 1000m
          memory: 1Gi
        limits:
          cpu: 4000m
          memory: 2Gi
    physicalbackup:
      enabled: true
      bucket: "mardi"
      prefix: "production/physicalbackup/mariadb"
      endpoint: "dasi03.zib.de:9000"
      region: "zib-1"
      schedule: "0 2 * * *"
      timeout: "30h"
    resources:
      requests:
        cpu: 4000m
        memory: 24Gi
      limits:
        cpu: 8000m
        memory: 28Gi
    secrets:
      wikibase: wikibase-env-secrets
