apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kafka
spec:
  chart:
    spec:
      version: "0.1.9"
  values:
    image:
      repository: apache/kafka
      tag: "3.9.2@sha256:05b4616e0702ef2729327705d54ad6b50ea70b271c4b730fabd2320789fb7b02"
    replicaCount: 3
    replicationFactor: 3
    minIsr: 2

    # Resources per broker
    storage: 20Gi
    resources:
      requests:
        cpu: "500m"
        memory: "4Gi"
      limits:
        cpu: "2000m"
        memory: "4Gi"
    heapOpts: "-Xmx2G -Xms2G"

    # Log retention
    logRetentionHours: 72
    logRetentionBytes: 5368709120   # 5Gi
    logSegmentBytes: 536870912      # 512Mi
    logRetentionCheckIntervalMs: 300000
