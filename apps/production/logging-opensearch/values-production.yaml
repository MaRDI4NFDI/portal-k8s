apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: logging-opensearch
spec:
  chart:
    spec:
      version: "0.1.1"
  values:
    # Log storage for staging and production MediaWiki,
    # apart from the CirrusSearch cluster.
    image:
      repository: opensearchproject/opensearch
      tag: "3.10.1@sha256:02358b2be62b268a404a54581184d027ac0dfa8f875be15fe4c4fa3f8884f464"
    storage:
      size: 10Gi
      className: csi-rbd-sc
    resources:
      requests:
        memory: "3Gi"
        cpu: "500m"
      limits:
        memory: "4Gi"
        cpu: "2"
    javaOpts: "-Xms2g -Xmx2g"
