apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: change-propagation
spec:
  chart:
    spec:
      version: "0.1.6"
  values:
    image:
      repository: docker-registry.wikimedia.org/wikimedia/mediawiki-services-change-propagation
      tag: "2026-06-03-110026-production@sha256:56cc3a61621776e4157de19503c089fc89061ebcf7a8c9fd906e683437bfc976"
    mediawiki:
      host: http://wikibase-jobrunner
    jobqueue:
      concurrency: 35
      numWorkers: 2
      workerHeapLimitMb: 750
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 1Gi
