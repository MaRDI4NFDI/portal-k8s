apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wdqs
spec:
  chart:
    spec:
      version: "0.1.27"
  values:
    wdqs:
      image:
        repository: wikibase/wdqs
        tag: "2.2.0@sha256:f6416c4f2d253969b63d5ff40cc61db2897197e24f1c472dd2068603423846b6"
      storage: 200Gi
      memory: "-Xmx16g -Xms16g"
      heap_size: "16g"
      opts: "-Dorg.wikidata.query.rdf.tool.rdf.RdfRepository.timeout=3600"
      resources:
        requests:
          cpu: 1000m
          memory: 48Gi
        limits:
          cpu: 4000m
          memory: 48Gi
    updater:
      enabled: true
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
        limits:
          cpu: 1000m
          memory: 2Gi

    frontend:
      image:
        repository: wikibase/wdqs-frontend
        tag: "2.2.1@sha256:6e51acf52f274c3127386a2d5a670112d417dce53745601fe678239a79358a15"
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
