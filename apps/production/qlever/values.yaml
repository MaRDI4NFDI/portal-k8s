apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qlever
spec:
  chart:
    spec:
      version: "0.1.33"
  values:
    qlever:
      maintenance: false
      image:
        repository: adfreiburg/qlever
        tag: "latest@sha256:fa1490b99decf09d1d33b3e74327cfe4748d8509a313620513cd00268e153fba"
      resources:
        requests:
          memory: "8Gi"
          cpu: "2000m"
        limits:
          memory: "32Gi"
          cpu: "12000m"
      storage:
        size: "200Gi"
        existingClaim: qlever-data-ssd
      server:
        memoryForQueries: 20G
        cacheMaxSize: 6G
        timeout: 300s
        enableMetrics: true
    frontend:
      image:
        repository: adfreiburg/qlever-ui
        tag: "latest@sha256:2bdbfac438c8d43ae5337bb547993b1880e5c43b63871c74ca180aa123644851"
    ingress:
      enabled: true
    readonlyProxy:
      image:
        repository: nginx
        tag: "1.31.7-alpine@sha256:892bb2152464f0c5d8972593a5f5afaf8054552580b699d95f8ff4af08c2d33d"
    updater:
      enabled: true
    resync:
      enabled: true
