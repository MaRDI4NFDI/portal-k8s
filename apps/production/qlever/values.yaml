apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qlever
spec:
  chart:
    spec:
      version: "0.1.25"
  values:
    qlever:
      image:
        tag: "latest@sha256:119355a81be22d3fb5d61d2236986bd2c6351c5c3fc82c0b2b293a7e08c83724"
      resources:
        requests:
          memory: "8Gi"
          cpu: "2000m"
        limits:
          memory: "32Gi"
          cpu: "12000m"
      storage:
        size: "190Gi"
        className: "csi-rbd-sc"
      server:
        memoryForQueries: 20G
        cacheMaxSize: 6G
        timeout: 300s
    ingress:
      enabled: true
    updater:
      enabled: true
    resync:
      enabled: true
