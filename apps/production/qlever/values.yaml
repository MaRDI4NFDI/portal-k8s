apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qlever
spec:
  chart:
    spec:
      version: "0.1.33"
  values:
    qlever:
      maintenance: false
      image:
        repository: adfreiburg/qlever
        tag: "latest@sha256:65b73960b075f0209911ec1ef6d260061cc85635d710a9990361e5ae322d2623"
      resources:
        requests:
          memory: "8Gi"
          cpu: "2000m"
        limits:
          memory: "32Gi"
          cpu: "12000m"
      storage:
        size: "200Gi"
        existingClaim: qlever-data-ssd
      server:
        memoryForQueries: 20G
        cacheMaxSize: 6G
        timeout: 300s
        enableMetrics: true
    frontend:
      image:
        repository: adfreiburg/qlever-ui
        tag: "latest@sha256:2bdbfac438c8d43ae5337bb547993b1880e5c43b63871c74ca180aa123644851"
    ingress:
      enabled: true
    readonlyProxy:
      image:
        repository: nginx
        tag: "1.31.9-alpine@sha256:fb4658584bd9a916ffb6f6e365f97c25cfdb2923801f551ea08356e695f14ff7"
    updater:
      enabled: true
    resync:
      enabled: true
