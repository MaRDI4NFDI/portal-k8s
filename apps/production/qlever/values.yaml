apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qlever
spec:
  chart:
    spec:
      version: "0.1.26"
  values:
    qlever:
      maintenance: false
      image:
        tag: "latest@sha256:826807a37cb369d491ad3bfcb9f6b17ee208352e620e8c146259b8142d791db7"
      resources:
        requests:
          memory: "8Gi"
          cpu: "2000m"
        limits:
          memory: "32Gi"
          cpu: "12000m"
      storage:
        size: "190Gi"
        className: "csi-rbd-sc"
      server:
        memoryForQueries: 20G
        cacheMaxSize: 6G
        timeout: 300s
    ingress:
      enabled: true
    updater:
      enabled: true
    resync:
      enabled: true
