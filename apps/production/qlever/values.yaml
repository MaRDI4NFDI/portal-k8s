apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qlever
spec:
  chart:
    spec:
      version: "0.1.33"
  values:
    qlever:
      maintenance: false
      image:
        repository: adfreiburg/qlever
        tag: "latest@sha256:02acf43dddaf04ec440696ff24539a949c716b5ed79efe6afebfa4d574b1cd84"
      resources:
        requests:
          memory: "8Gi"
          cpu: "2000m"
        limits:
          memory: "32Gi"
          cpu: "12000m"
      storage:
        size: "200Gi"
        existingClaim: qlever-data-ssd
      server:
        memoryForQueries: 20G
        cacheMaxSize: 6G
        timeout: 300s
        enableMetrics: true
    frontend:
      image:
        repository: adfreiburg/qlever-ui
        tag: "latest@sha256:2bdbfac438c8d43ae5337bb547993b1880e5c43b63871c74ca180aa123644851"
    ingress:
      enabled: true
    readonlyProxy:
      image:
        repository: nginx
        tag: "1.31.8-alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11"
    updater:
      enabled: true
    resync:
      enabled: true
