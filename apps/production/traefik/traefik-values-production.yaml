apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
spec:
  chart:
    spec:
      version: "40.0.0"
  values:
    ingressRoute:
      dashboard:
        enabled: true
    service:
      spec:
        loadBalancerIP: "130.73.131.224"
    ports:
      ipfs-swarm-tcp:
        port: 4001
        expose:
          default: true
        exposedPort: 4001
        protocol: TCP
      ipfs-swarm-udp:
        port: 4001
        expose:
          default: true
        exposedPort: 4001
        protocol: UDP
      doip-tls1:
        port: 3567
        expose:
          default: true
        exposedPort: 3567
        protocol: TCP
      doip-tls2:
        port: 3568
        expose:
          default: true
        exposedPort: 3568
        protocol: TCP
      metrics:
        expose:
          default: false
        port: 9100
        protocol: TCP
    metrics:
      prometheus:
        addRoutersLabels: true
        buckets: "0.1,0.3,1.2,5.0,10.0"
        serviceMonitor:
          enabled: true
          interval: 30s
    #additionalArguments:
    #  - "--entrypoints.websecure.http.middlewares=production-crowdsec-bouncer@kubernetescrd"
    logs:
      general:
        level: WARN
      access:
        enabled: true
        format: json
        fields:
          headers:
            defaultmode: drop
            names:
              User-Agent: keep
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
    experimental:
      plugins:
        blockuseragent:
          moduleName: "github.com/agence-gaya/traefik-plugin-blockuseragent"
          version: "v0.1.7"
        fail2ban:
          moduleName: "github.com/tomMoulard/fail2ban"
          version: "v0.8.7"
        crowdsec:
          moduleName: "github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
          version: "v1.4.6"
