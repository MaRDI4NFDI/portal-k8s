apiVersion: apps/v1
kind: Deployment
metadata:
  name: ffmpeg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ffmpeg
  template:
    metadata:
      labels:
        app: ffmpeg
    spec:
      containers:
      - name: ffmpeg
        image: docker-registry.wikimedia.org/wikimedia/mediawiki-libs-shellbox:video83@sha256:33b6ef91d02c01dd98c03be49dbd53e6e907145128bd2cdd62c8afdfc451d786
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 1000m