apiVersion: apps/v1
kind: Deployment
metadata:
  name: ffmpeg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ffmpeg
  template:
    metadata:
      labels:
        app: ffmpeg
    spec:
      containers:
      - name: ffmpeg
        image: docker-registry.wikimedia.org/wikimedia/mediawiki-libs-shellbox:video83@sha256:a53685f92f6f12ef42a529f9c5c718a48f8e0f09dd72b880fb8e46f93393fdc6
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 1000m