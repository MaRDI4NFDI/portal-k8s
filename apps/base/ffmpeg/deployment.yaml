apiVersion: apps/v1
kind: Deployment
metadata:
  name: ffmpeg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ffmpeg
  template:
    metadata:
      labels:
        app: ffmpeg
    spec:
      containers:
      - name: ffmpeg
        image: docker-registry.wikimedia.org/wikimedia/mediawiki-libs-shellbox:video83@sha256:7d58526fb3566a25866ecefb386f5d5519629ccd3bb1e5433a6108e8e20265f8
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 1000m