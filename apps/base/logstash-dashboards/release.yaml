# Search for the logs in logging-opensearch. No ingress on purpose;
# open it by port-forward (see ../logstash/README.md).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: logstash-dashboards
spec:
  interval: 5m
  chart:
    spec:
      chart: stateless-service
      sourceRef:
        kind: HelmRepository
        name: portal-k8s
        namespace: flux-system
  values:
    image:
      repository: opensearchproject/opensearch-dashboards
    containerPort: 5601
    servicePort: 5601
    env:
      - name: OPENSEARCH_HOSTS
        value: '["http://logging-opensearch:9200"]'
      - name: DISABLE_SECURITY_DASHBOARDS_PLUGIN
        value: "true"
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
