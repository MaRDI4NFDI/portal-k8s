apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wikibase
spec:
  interval: 5m
  timeout: 15m
  # The update Job can run for hours; do not hold the release.
  install:
    disableWaitForJobs: true
  upgrade:
    disableWaitForJobs: true
  chart:
    spec:
      chart: wikibase
      sourceRef:
        kind: HelmRepository
        name: portal-k8s
        namespace: flux-system
