apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
spec:
  interval: 5m
  # Staging and production share the same cluster-wide CRDs, applied by the
  # tenant-mardi-traefik-crds Flux Kustomization (clusters/mardi/traefik-crds.yaml).
  install:
    crds: Skip
  upgrade:
    crds: Skip
  chart:
    spec:
      chart: traefik
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  values:
    ingressRoute:
      dashboard:
        enabled: false
    logs:
      general:
        maxBackups: 3
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
    # Configure TLS
