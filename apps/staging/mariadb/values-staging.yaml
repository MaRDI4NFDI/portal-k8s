apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: staging-mariadb
  namespace: staging
spec:
  chart:
    spec:
      version: "0.1.50"
  values:
    replicas: 2
    replication:
      enabled: true
      replica:
        maxLagSeconds: 30
        recovery:
          enabled: true
    database: my_wiki
    user: sqluser
    mariadb:
      config:
        innodbBufferPoolSize: "1536M"
        maxAllowedPacket: "64M"
    storage:
      size: 5Gi
      className: csi-rbd-sc
    backup:
      storage: 5Gi
    physicalbackup:
      enabled: true
      bucket: "mardi"
      prefix: "staging/physicalbackup/mariadb"
      endpoint: "dasi03.zib.de:9000"
      region: "zib-1"
      schedule: "0 5 * * *"
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 1000m
        memory: 3Gi
    secrets:
      wikibase: staging-wikibase-env-secrets
      importer: staging-importer-secrets
