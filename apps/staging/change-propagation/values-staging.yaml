apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: change-propagation
  namespace: staging
spec:
  chart:
    spec:
      version: "0.1.6"
  values:
    image:
      repository: docker-registry.wikimedia.org/wikimedia/mediawiki-services-change-propagation
      tag: "2026-06-03-110026-production"
    mediawiki:
      host: http://staging-wikibase-jobrunner
    kafka:
      replicas: 1
    jobqueue:
      concurrency: 4
