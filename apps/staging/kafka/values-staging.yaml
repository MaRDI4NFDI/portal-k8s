apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kafka
  namespace: staging
spec:
  chart:
    spec:
      version: "0.1.9"
  values:
    image:
      repository: apache/kafka
      tag: "3.9.2"
    replicaCount: 1
    replicationFactor: 1
    minIsr: 1
    numPartitions: 1
    antiAffinity: "soft"
