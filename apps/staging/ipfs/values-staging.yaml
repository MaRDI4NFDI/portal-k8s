apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ipfs
spec:
  chart:
    spec:
      version: "0.2.6"
  values:
    public: false
    rpc:
      inCluster: true
      tokenSecret:
        name: staging-wikibase-env-secrets
        key: MATHSEARCH_IPFS_TOKEN
    storage:
      size: 5Gi
    dlockss:
      enabled: true
      nodeName: mardi-staging
      image:
        repository: ghcr.io/gipplab/dlockss-single-node
        tag: "1ed35c6@sha256:8f151d2c0cf77e070268d7eb6bb122a63b73531b77a457210d0f0d5e5e35a615"
      env:
        DLOCKSS_DISCOVERY_TAG: dlockss-staging
        DLOCKSS_PRIVATE_NETWORK: "true"
        DLOCKSS_WIKI_API: http://staging-wikibase/w/rest.php
        DLOCKSS_PIN_INGEST_DELAY: "1m"
