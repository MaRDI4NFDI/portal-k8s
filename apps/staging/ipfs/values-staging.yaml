apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ipfs
spec:
  chart:
    spec:
      version: "0.2.6"
  values:
    public: false
    rpc:
      inCluster: true
      tokenSecret:
        name: staging-wikibase-env-secrets
        key: MATHSEARCH_IPFS_TOKEN
    storage:
      size: 5Gi
    dlockss:
      enabled: true
      nodeName: mardi-staging
      image:
        repository: ghcr.io/gipplab/dlockss-single-node
        tag: "bd4131f@sha256:f118395d10640da396101b292b2cc06cd1807fddd6cb57844b0aab57d4ce1ad1"
      env:
        DLOCKSS_DISCOVERY_TAG: dlockss-staging
        DLOCKSS_PRIVATE_NETWORK: "true"
        DLOCKSS_WIKI_API: https://staging.mardi4nfdi.org/w/rest.php
