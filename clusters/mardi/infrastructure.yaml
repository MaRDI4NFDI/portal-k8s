apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tenant-mardi-infra
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: tenant-mardi
  path: ./infrastructure
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
